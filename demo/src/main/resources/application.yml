spring:
  application:
    name: demo
  datasource:
    url: jdbc:mysql://localhost:3306/action_hub?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: your-secret-key-change-this-in-production
  expiration: 3600000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.senai.demo: DEBUG
